<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resultado da leitura crítica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    body {
      background: #f6f4f0;
      color: #282821;
    }
    .hero {
      background: radial-gradient(ellipse at top right, #e8e2d4, transparent 55%), #fbfaf7;
      border: 1px solid #e9e5dc;
    }
    .result-card {
      background: #fff;
      border: 1px solid #e9e5dc;
      border-radius: 1rem;
    }
    #result > :last-child { margin-bottom: 0; }
    #result h2 { font-size: 1.4rem; margin-top: 1.5rem; }
    #result h2:first-child { margin-top: 0; }
    #result h3 { font-size: 1.1rem; margin-top: 1.25rem; }
    #result blockquote { border-left: 3px solid #829078; padding-left: .75rem; color: #797970; }
    #result hr { color: #e9e5dc; opacity: 1; }
    #result table { width: 100%; margin-bottom: 1rem; }
    #result th, #result td { border: 1px solid #e9e5dc; padding: .5rem; vertical-align: top; }
    #result th { background: #edf0e9; }
  </style>
</head>
<body>
  <main class="container py-5" style="max-width: 900px;">
    <a class="btn btn-sm btn-outline-secondary mb-4" href="{{ url_for('main.leitura_critica') }}">← Nova leitura</a>

    <header class="hero rounded-4 p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold text-secondary mb-2">Leitura crítica</p>
      <h1 class="display-6 fw-semibold mb-2">Resultado</h1>
      <p class="text-secondary mb-0">Arquivo: {{ filename }}</p>
    </header>

    <article class="result-card p-4 p-md-5">
      <div id="result"></div>
    </article>
  </main>

  <script>
    const markdown = {{ result|tojson }};
    document.getElementById("result").innerHTML = DOMPurify.sanitize(marked.parse(markdown));
  </script>
</body>
</html>
