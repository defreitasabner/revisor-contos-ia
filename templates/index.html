<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisor de Conto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    #log { height: 60vh; overflow-y: auto; }
    .user-msg { white-space: pre-wrap; }
    .bot-msg > :last-child { margin-bottom: 0; }
    .bot-msg h1, .bot-msg h2, .bot-msg h3 { font-size: 1.15rem; margin-top: 1rem; }
    .bot-msg blockquote { border-left: 3px solid #ced4da; padding-left: .75rem; color: #6c757d; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 800px;">
    <h1 class="h3 mb-3">Revisor de Contos</h1>

    <div id="log" class="bg-white border rounded p-3 mb-3"></div>

    <form id="form">
      <textarea name="message" class="form-control mb-2" rows="4"
        placeholder="Contexto opcional para a avaliação (ex.: é um microconto; preciso encurtar para 500 palavras)..."></textarea>
      <div class="d-flex gap-2">
        <input type="file" name="file" class="form-control" accept=".docx,.pdf,.txt,.md">
        <button type="submit" id="send" class="btn btn-primary">Enviar</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById("form");
    const log = document.getElementById("log");
    const send = document.getElementById("send");
    const history = [];

    function add(cls, text) {
      const div = document.createElement("div");
      div.className = cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const file = data.get("file");
      const text = data.get("message").trim();
      if (!text && !(file && file.name)) return;

      const label = [text, file && file.name ? `[arquivo: ${file.name}]` : ""].join(" ").trim();
      add("user-msg bg-primary-subtle rounded p-2 mb-3 ms-5", label);
      data.append("history", JSON.stringify(history));
      form.reset();
      send.disabled = true;
      const reply = add("bot-msg border rounded p-3 mb-3 me-5 text-muted", "Avaliando...");

      try {
        const res = await fetch("/chat", { method: "POST", body: data });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error);
        reply.className = "bot-msg border rounded p-3 mb-3 me-5";
        reply.innerHTML = DOMPurify.sanitize(marked.parse(json.reply));
        history.push({ role: "user", text: json.sent }, { role: "model", text: json.reply });
      } catch (err) {
        reply.className = "alert alert-danger mb-3";
        reply.textContent = err.message;
      } finally {
        send.disabled = false;
        log.scrollTop = log.scrollHeight;
      }
    });
  </script>
</body>
</html>
