<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitura crítica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f6f4f0;
      color: #282821;
    }
    .hero {
      background: radial-gradient(ellipse at top right, #e8e2d4, transparent 55%), #fbfaf7;
      border: 1px solid #e9e5dc;
    }
    .form-card {
      background: #fff;
      border: 1px solid #e9e5dc;
      border-radius: 1rem;
    }
    .form-control:focus {
      border-color: #829078;
      box-shadow: 0 0 0 .25rem #8290783d;
    }
    .btn-sage {
      background: #526449;
      border-color: #526449;
      color: #fff;
    }
    .btn-sage:hover, .btn-sage:disabled {
      background: #435339;
      border-color: #435339;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="container py-5" style="max-width: 800px;">
    <a class="btn btn-sm btn-outline-secondary mb-4" href="{{ url_for('index') }}">← Ferramentas</a>

    <header class="hero rounded-4 p-4 p-md-5 mb-4">
      <p class="text-uppercase small fw-semibold text-secondary mb-2">Oficina de Contos</p>
      <h1 class="display-6 fw-semibold mb-3">Leitura crítica</h1>
      <p class="fs-5 text-secondary mb-0">
        Anexe o arquivo e adicione contexto para direcionar a leitura.
      </p>
    </header>

    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form id="form" class="form-card p-4" method="post" enctype="multipart/form-data">
      <div class="mb-4">
        <label for="file" class="form-label fw-semibold">Arquivo do conto</label>
        <input type="file" id="file" name="file" class="form-control" accept=".docx,.pdf,.txt,.md" required>
        <div class="form-text">Formatos aceitos: .docx, .pdf, .txt e .md.</div>
      </div>

      <div class="mb-4">
        <label for="context" class="form-label fw-semibold">Contexto</label>
        <textarea id="context" name="context" class="form-control" rows="5"
          placeholder="Ex.: é um microconto; preciso encurtar para 500 palavras...">{{ context or '' }}</textarea>
        <div class="form-text">Opcional. Ajuda a calibrar a avaliação.</div>
      </div>

      <button type="submit" id="send" class="btn btn-sage px-4">Solicitar leitura</button>
    </form>
  </main>

  <script>
    document.getElementById("form").addEventListener("submit", () => {
      const send = document.getElementById("send");
      send.disabled = true;
      send.textContent = "Avaliando...";
    });
  </script>
</body>
</html>
